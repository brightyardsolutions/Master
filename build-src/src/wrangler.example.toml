# Local development only. Copy to wrangler.toml to use `npx wrangler pages dev`.
# Production settings live in the Cloudflare dashboard (see README), so this file is not committed as wrangler.toml.
name = "brightyard"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

[vars]
SITE_URL = "http://localhost:8788/"
MAIL_FROM = "Brightyard <blueprints@brightyard.in>"
TEAM_EMAIL = "hello@brightyard.in"
MAIL_LOG = "1"   # log emails to the terminal instead of sending them (used only when no ZEPTOMAIL_TOKEN is set)

[[d1_databases]]
binding = "DB"
database_name = "brightyard"
database_id = "local"
